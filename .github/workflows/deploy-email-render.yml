name: Deploy Email Render

on:
  push:
    branches: [main]
    paths:
      - "services/email-render/**"
      - "libs/engine/**"
      - "libs/gossamer/**"
      - "libs/infra/**"
      - "libs/prism/**"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-worker.yml
    with:
      worker-dir: services/email-render
      needs-engine: true
      typecheck-command: "node scripts/sync-templates.mjs && pnpm exec tsc --noEmit"
    secrets: inherit
