# Reusable workflow for deploying Cloudflare Pages apps.
#
# Each Pages app (amber, domains, meadow, terrarium, etc.) calls this with its own
# parameters. The calling workflow still appears as its own entry in the
# Actions tab with full step-level logs — zero observability loss.
#
# NOTE: Reusable workflows cannot use local composite actions (like
# grove-setup) because GitHub pre-validates action references before
# checkout. Setup steps are inlined here instead.
#
# Usage (thin shim):
#   jobs:
#     deploy:
#       uses: ./.github/workflows/_deploy-pages.yml
#       with:
#         app-dir: apps/landing
#         project-name: grove-landing
#       secrets: inherit

name: _Deploy Pages App

on:
  workflow_call:
    inputs:
      app-dir:
        description: "App directory relative to repo root (e.g. apps/landing)"
        required: true
        type: string
      project-name:
        description: "Cloudflare Pages project name (e.g. grove-landing)"
        required: true
        type: string
      needs-engine:
        description: "Build libs/engine before deploying"
        required: false
        type: boolean
        default: true
      needs-foliage:
        description: "Build libs/foliage before engine"
        required: false
        type: boolean
        default: false
      run-typecheck:
        description: "Run type checking"
        required: false
        type: boolean
        default: true
      run-tests:
        description: "Run tests before deploying"
        required: false
        type: boolean
        default: false
      test-command:
        description: "Test command to run (default: pnpm test:run)"
        required: false
        type: string
        default: "pnpm test:run"
      run-migrations:
        description: "Run D1 database migrations before deploying"
        required: false
        type: boolean
        default: false
      migration-db:
        description: "D1 database name for migrations"
        required: false
        type: string
        default: ""
      checkout-ref:
        description: "Git ref to checkout (default: triggering ref)"
        required: false
        type: string
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      issues: write   # post-deploy steps open/close rolling failure issues

    steps:
      # ── Inline grove-setup (can't use composite action in reusable workflow) ──
      - name: Checkout
        if: inputs.checkout-ref == ''
        uses: actions/checkout@v5

      - name: Checkout (specific ref)
        if: inputs.checkout-ref != ''
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: "**/pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install

      - name: Build foliage
        if: inputs.needs-foliage
        run: pnpm run build
        working-directory: libs/foliage

      - name: Build gossamer
        if: inputs.needs-engine
        run: pnpm run build
        working-directory: libs/gossamer

      - name: Build engine
        if: inputs.needs-engine
        run: pnpm run package
        working-directory: libs/engine

      # ── App build & deploy ──────────────────────────────────────────────
      - name: Type check
        if: inputs.run-typecheck
        run: pnpm check
        working-directory: ${{ inputs.app-dir }}

      - name: Build
        run: pnpm run build
        working-directory: ${{ inputs.app-dir }}

      - name: Run tests
        if: inputs.run-tests
        run: ${{ inputs.test-command }}
        working-directory: ${{ inputs.app-dir }}

      - name: Run database migrations
        if: inputs.run-migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply ${{ inputs.migration-db }} --remote
          workingDirectory: ${{ inputs.app-dir }}
          packageManager: pnpm

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .svelte-kit/cloudflare --project-name=${{ inputs.project-name }}
          workingDirectory: ${{ inputs.app-dir }}
          packageManager: pnpm

      # ── Rolling failure issue: open/comment on fail, close on recovery ─
      # Mirrors the logic in _deploy-worker.yml. One GitHub Issue per
      # service with label `deploy-failed`. New failure reopens + appends;
      # next successful deploy auto-closes with a recovery note.
      - name: Open or update failure issue
        if: failure() && github.event_name == 'push'
        uses: actions/github-script@v8
        with:
          script: |
            const appDir = '${{ inputs.app-dir }}';
            const service = appDir.split('/').pop();
            const title = `Deploy failing: ${service}`;
            const { owner, repo } = context.repo;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${context.runId}`;
            const sha = context.sha.slice(0, 7);
            const msg = (context.payload.head_commit?.message || '').split('\n')[0] || '(no message)';

            const body = [
              `❌ Deploy to \`${service}\` failed at commit \`${sha}\`.`,
              '',
              `- **Run:** [${context.runId}](${runUrl})`,
              `- **Commit:** \`${sha}\` — ${msg}`,
              `- **Triggered by:** @${context.actor}`,
              '',
              '_This issue was auto-opened by `_deploy-pages.yml`. It will close automatically on the next successful deploy._',
            ].join('\n');

            const { data: existing } = await github.rest.issues.listForRepo({
              owner, repo, state: 'all', labels: 'deploy-failed', per_page: 100,
            });
            const match = existing.find((i) => i.title === title);

            if (match) {
              if (match.state === 'closed') {
                await github.rest.issues.update({ owner, repo, issue_number: match.number, state: 'open' });
              }
              await github.rest.issues.createComment({ owner, repo, issue_number: match.number, body });
            } else {
              await github.rest.issues.create({
                owner, repo, title, body,
                labels: ['deploy-failed', `deploy-failed/${service}`],
              });
            }

      - name: Close failure issue on recovery
        if: success() && github.event_name == 'push'
        uses: actions/github-script@v8
        with:
          script: |
            const appDir = '${{ inputs.app-dir }}';
            const service = appDir.split('/').pop();
            const title = `Deploy failing: ${service}`;
            const { owner, repo } = context.repo;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${context.runId}`;

            const { data: existing } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'deploy-failed', per_page: 100,
            });
            const match = existing.find((i) => i.title === title);
            if (!match) return;

            await github.rest.issues.createComment({
              owner, repo, issue_number: match.number,
              body: `✅ Deploy to \`${service}\` recovered. [Run ${context.runId}](${runUrl}).`,
            });
            await github.rest.issues.update({
              owner, repo, issue_number: match.number, state: 'closed',
            });
