name: Deploy Subscription Digest

on:
  push:
    branches: [main]
    paths:
      - "workers/subscription-digest/**"
      - "libs/engine/**"
      - "libs/gossamer/**"
      - "libs/infra/**"
      - "libs/prism/**"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  issues: write

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-worker.yml
    with:
      worker-dir: workers/subscription-digest
      needs-engine: true
    secrets: inherit
