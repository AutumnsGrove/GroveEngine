name: Deploy Email Catchup

on:
  push:
    branches: [main]
    paths:
      - "workers/email-catchup/**"
      - "libs/engine/**"
      - "libs/gossamer/**"
      - "libs/infra/**"
      - "libs/prism/**"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  issues: write

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-worker.yml
    with:
      worker-dir: workers/email-catchup
      needs-engine: true
      run-tests: true
    secrets: inherit
