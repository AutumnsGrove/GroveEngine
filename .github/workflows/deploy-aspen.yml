name: Deploy Aspen

on:
  push:
    branches: [main]
    paths:
      - "apps/aspen/**"
      # Aspen imports from every Grove workspace package (engine, prism
      # tokens + icons, infra's shared Vite config, gossamer via engine).
      # Without these path triggers a change to any of them quietly fails
      # to redeploy Aspen, which is how "things weren't landing."
      - "libs/engine/**"
      - "libs/gossamer/**"
      - "libs/infra/**"
      - "libs/prism/**"
      - "libs/foliage/**"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-worker.yml
    with:
      worker-dir: apps/aspen
      needs-engine: true
      run-typecheck: false
      run-tests: true
      run-build: true
    secrets: inherit
