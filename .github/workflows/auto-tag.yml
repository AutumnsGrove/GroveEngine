---
name: Auto-tag on Version Bump

on:
  push:
    branches:
      - main
    paths:
      - "libs/engine/package.json"
  workflow_dispatch:
    inputs:
      force_snapshot:
        description: >
          Force snapshot generation even without version change
        required: false
        default: false
        type: boolean
      backfill_summaries:
        description: >
          Backfill AI summaries for all historical versions
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  tag-and-snapshot:
    if: github.event.inputs.backfill_summaries != true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history for accurate commit count
          fetch-depth: 0

      - name: Check for version change
        id: version
        run: |
          # Get current version
          CURRENT=$(jq -r '.version' libs/engine/package.json)
          echo "current=$CURRENT" >> $GITHUB_OUTPUT

          # Get previous version
          git show HEAD~1:libs/engine/package.json \
            > /tmp/prev-package.json 2>/dev/null \
            || echo '{"version":"0.0.0"}' > /tmp/prev-package.json
          PREVIOUS=$(jq -r '.version' /tmp/prev-package.json)
          echo "previous=$PREVIOUS" >> $GITHUB_OUTPUT

          # Check if changed
          if [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Version changed: $PREVIOUS → $CURRENT"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Version unchanged: $CURRENT"
          fi

      - name: Check if tag exists
        id: tag_exists
        if: steps.version.outputs.changed == true
        run: |
          TAG="v${{ steps.version.outputs.current }}"
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG"; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag $TAG already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag $TAG does not exist"
          fi

      - name: Create and push tag
        id: create_tag
        if: >
          steps.version.outputs.changed == true &&
          steps.tag_exists.outputs.exists == false
        run: |
          TAG="v${{ steps.version.outputs.current }}"
          git config user.name "github-actions[bot]"
          git config user.email \
            "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          echo "Created and pushed tag: $TAG"

      - name: Generate repository snapshot
        id: snapshot
        if: >
          steps.version.outputs.changed == true ||
          github.event.inputs.force_snapshot == true
        run: |
          TAG_FROM_CREATE="${{ steps.create_tag.outputs.tag_name }}"
          TAG_FROM_VERSION="v${{ steps.version.outputs.current }}"
          TAG="${TAG_FROM_CREATE:-$TAG_FROM_VERSION}"
          echo "Generating snapshot for: $TAG"

          chmod +x ./scripts/repo/repo-snapshot.sh
          ./scripts/repo/repo-snapshot.sh "$TAG"

          echo "tag_name=$TAG" >> $GITHUB_OUTPUT

      - name: Generate release summary
        id: summary
        if: steps.snapshot.outcome == 'success'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          TAG="${{ steps.snapshot.outputs.tag_name }}"
          echo "Generating release summary for: $TAG"

          # Make script executable
          chmod +x ./scripts/generate/generate-release-summary.sh

          # Generate summary (will use previous tag automatically)
          ./scripts/generate/generate-release-summary.sh "$TAG" \
            || echo "Warning: Summary generation failed, continuing..."

      - name: Setup pnpm
        if: steps.snapshot.outcome == 'success'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: steps.snapshot.outcome == 'success'
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "**/pnpm-lock.yaml"

      - name: Calculate total ecosystem size
        if: steps.snapshot.outcome == 'success'
        run: |
          set -e

          TAG="${{ steps.snapshot.outputs.tag_name }}"
          echo "Calculating total ecosystem size for: $TAG"

          TAG_SAFE=$(echo "$TAG" | sed 's/[^a-zA-Z0-9._-]//g')
          if [[ "$TAG" != "$TAG_SAFE" ]]; then
            echo "Error: TAG contains invalid characters"
            exit 1
          fi

          echo "Installing dependencies..."
          pnpm install \
            || { echo "Failed to install dependencies"; exit 1; }

          TOTAL_SIZE=0
          MEASURE_DIR="/tmp/pkg-measure"

          measure_unpacked() {
            local dir="$1"
            if SIZE=$(du -sb "$dir" 2>/dev/null | cut -f1); then
              echo "$SIZE"
            elif SIZE_KB=$(du -sk "$dir" 2>/dev/null | cut -f1); then
              echo "$((SIZE_KB * 1024))"
            else
              echo "0"
            fi
          }

          fmt_bytes() {
            numfmt --to=iec "$1" 2>/dev/null || echo "$1"
          }

          # --- Measure all npm packages in libs/ ---
          for LIB_DIR in libs/*/; do
            [ -f "$LIB_DIR/package.json" ] || continue
            LIB_NAME=$(basename "$LIB_DIR")
            echo ""
            echo "=== libs/$LIB_NAME ==="

            cd "$LIB_DIR"

            if jq -e '.scripts.package' package.json >/dev/null 2>&1; then
              echo "  Running pnpm run package..."
              pnpm run package 2>&1 | tail -3 || true
            elif jq -e '.scripts.build' package.json >/dev/null 2>&1; then
              echo "  Running pnpm run build..."
              pnpm run build 2>&1 | tail -3 || true
            fi

            TARBALL=$(pnpm pack 2>/dev/null | tail -1)
            if [[ -n "$TARBALL" && -f "$TARBALL" ]]; then
              rm -rf "$MEASURE_DIR"
              mkdir -p "$MEASURE_DIR"
              tar -xzf "$TARBALL" -C "$MEASURE_DIR"
              PKG_SIZE=$(measure_unpacked "$MEASURE_DIR/package")
              TOTAL_SIZE=$((TOTAL_SIZE + PKG_SIZE))
              echo "  Unpacked: $PKG_SIZE bytes ($(fmt_bytes "$PKG_SIZE"))"
              rm -f "$TARBALL"
              rm -rf "$MEASURE_DIR"
            else
              echo "  Skipped (no tarball produced)"
            fi

            cd "$GITHUB_WORKSPACE"
          done

          # --- Measure Go tool source trees ---
          for TOOL_DIR in tools/grove-find-go tools/grove-wrap-go; do
            [ -d "$TOOL_DIR" ] || continue
            TOOL_NAME=$(basename "$TOOL_DIR")
            echo ""
            echo "=== tools/$TOOL_NAME ==="
            TOOL_SIZE=$(measure_unpacked "$TOOL_DIR")
            TOTAL_SIZE=$((TOTAL_SIZE + TOOL_SIZE))
            echo "  Source: $TOOL_SIZE bytes ($(fmt_bytes "$TOOL_SIZE"))"
          done

          # --- Measure other tool directories with package manifests ---
          for TOOL_DIR in tools/*/; do
            TOOL_NAME=$(basename "$TOOL_DIR")
            [[ "$TOOL_NAME" == "grove-find-go" || "$TOOL_NAME" == "grove-wrap-go" ]] && continue
            if [ -f "$TOOL_DIR/pyproject.toml" ] || [ -f "$TOOL_DIR/package.json" ]; then
              echo ""
              echo "=== tools/$TOOL_NAME ==="
              TOOL_SIZE=$(measure_unpacked "$TOOL_DIR")
              TOTAL_SIZE=$((TOTAL_SIZE + TOOL_SIZE))
              echo "  Source: $TOOL_SIZE bytes ($(fmt_bytes "$TOOL_SIZE"))"
            fi
          done

          echo ""
          echo "========================================"
          TOTAL_FMT=$(fmt_bytes "$TOTAL_SIZE")
          echo "Total ecosystem size: $TOTAL_SIZE bytes ($TOTAL_FMT)"
          echo "========================================"

          # --- Update history.csv ---
          CSV_FILE="snapshots/history.csv"

          HEADER=$(head -1 "$CSV_FILE")
          if [[ "$HEADER" != *"npm_unpacked_size"* ]]; then
            echo "Adding npm_unpacked_size column to CSV..."
            sed -i "1s/$/,npm_unpacked_size/" "$CSV_FILE"
            sed -i "2,\$s/$/,0/" "$CSV_FILE"
          fi

          SIZE_COL=$(
            head -1 "$CSV_FILE" | tr ',' '\n' |
            grep -n "npm_unpacked_size" | cut -d: -f1
          )
          if [[ -z "$SIZE_COL" ]]; then
            echo "Error: npm_unpacked_size column not found in header"
            exit 1
          fi
          echo "Found npm_unpacked_size at column $SIZE_COL"

          awk -F, -v tag="$TAG" -v size="$TOTAL_SIZE" \
            -v col="$SIZE_COL" \
            'BEGIN {OFS=","} NR==1 {print; next} \
             $2==tag {$col=size} {print}' \
            "$CSV_FILE" > "$CSV_FILE.tmp" \
            && mv "$CSV_FILE.tmp" "$CSV_FILE"

          echo "Verifying update..."
          grep "$TAG" "$CSV_FILE" \
            || { echo "Warning: Could not verify update"; }
          echo "Ecosystem size updated in $CSV_FILE"

      - name: Analyze documentation keywords
        if: steps.snapshot.outcome == 'success'
        run: |
          TAG="${{ steps.snapshot.outputs.tag_name }}"
          echo "Analyzing documentation keywords for: $TAG"

          # Run keyword analysis script
          pnpm exec tsx scripts/generate/analyze-doc-keywords.ts "$TAG" \
            || echo "Warning: Keyword analysis failed, continuing..."

      - name: Sync data to landing page
        if: steps.snapshot.outcome == 'success'
        run: |
          # Ensure landing data directory exists
          mkdir -p apps/landing/static/data

          # Copy the history CSV
          # so the /journey page can display it
          cp snapshots/history.csv \
            apps/landing/static/data/history.csv

          # Copy release summaries
          # so the /roadmap page can display them
          if [ -d snapshots/summaries ]; then
            mkdir -p apps/landing/static/data/summaries
            cp -r snapshots/summaries/* \
              apps/landing/static/data/summaries/ 2>/dev/null \
              || echo "No summaries to copy"
          fi

          # Copy word frequencies
          # so the /journey page can display them
          if [ -d snapshots/word-frequencies ]; then
            mkdir -p apps/landing/static/data/word-frequencies
            cp -r snapshots/word-frequencies/* \
              apps/landing/static/data/word-frequencies/ 2>/dev/null \
              || echo "No word frequencies to copy"
          fi

      - name: Commit and push snapshot
        if: steps.snapshot.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "github-actions[bot]@users.noreply.github.com"

          # Add snapshot files, summaries, and landing data
          git add snapshots/ apps/landing/static/data/

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "docs: add snapshot and summary for ${{ steps.snapshot.outputs.tag_name }}"
          git push origin main

      - name: Check if release exists
        id: release_exists
        if: steps.version.outputs.changed == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.current }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release $TAG exists (gw publish lattice)"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        if: >
          steps.version.outputs.changed == true &&
          steps.release_exists.outputs.exists != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_FROM_CREATE="${{ steps.create_tag.outputs.tag_name }}"
          TAG_FROM_VERSION="v${{ steps.version.outputs.current }}"
          TAG="${TAG_FROM_CREATE:-$TAG_FROM_VERSION}"
          VERSION="${{ steps.version.outputs.current }}"
          SUMMARY_FILE="snapshots/summaries/${TAG}.json"

          # Build release body from AI-generated summary
          if [ -f "$SUMMARY_FILE" ]; then
            SUMMARY=$(jq -r '.summary' "$SUMMARY_FILE")
            TOTAL_COMMITS=$(
              jq -r '.stats.totalCommits // "N/A"' "$SUMMARY_FILE"
            )

            # Extract scopes (areas of work)
            SCOPES=$(
              jq -r '.scopes[]? // empty' "$SUMMARY_FILE" | head -8 |
              sed 's/^/`/;s/$/`/' | paste -sd ', ' -
            )

            # Read each category.
            # Architecture (significant chore: commits) goes first
            # so structural/infra work isn't buried under features.
            ARCH=$(
              jq -r '.highlights.architecture[]? // empty' \
                "$SUMMARY_FILE" | sed 's/^/- /'
            )
            FEAT=$(jq -r '.highlights.features[]? // empty' "$SUMMARY_FILE" | sed 's/^/- /')
            FIXS=$(jq -r '.highlights.fixes[]? // empty' "$SUMMARY_FILE" | sed 's/^/- /')
            REFR=$(jq -r '.highlights.refactoring[]? // empty' "$SUMMARY_FILE" | sed 's/^/- /')
            PERF=$(jq -r '.highlights.performance[]? // empty' "$SUMMARY_FILE" | sed 's/^/- /')
            DOCS=$(jq -r '.highlights.docs[]? // empty' "$SUMMARY_FILE" | sed 's/^/- /')
            TSTS=$(jq -r '.highlights.tests[]? // empty' "$SUMMARY_FILE" | sed 's/^/- /')

            # Build HIGHLIGHTS by appending each non-empty section.
            # $'\n\n' is added OUTSIDE $() so bash's
            # trailing-newline stripping doesn't eat the blank line
            # that separates sections in GitHub markdown.
            NL=$'\n\n'
            HIGHLIGHTS=""
            [ -n "$ARCH" ] && HIGHLIGHTS="${HIGHLIGHTS}$(
              printf '**%s**\n%s' 'Architecture & Infrastructure' \
                "$ARCH"
            )${NL}"
            [ -n "$FEAT" ] && HIGHLIGHTS="${HIGHLIGHTS}$(
              printf '**%s**\n%s' 'Features' "$FEAT")${NL}"
            [ -n "$FIXS" ] && HIGHLIGHTS="${HIGHLIGHTS}$(printf '**%s**\n%s' 'Fixes' "$FIXS")${NL}"
            [ -n "$REFR" ] && HIGHLIGHTS="${HIGHLIGHTS}$(
              printf '**%s**\n%s' 'Refactoring' "$REFR")${NL}"
            [ -n "$PERF" ] && HIGHLIGHTS="${HIGHLIGHTS}$(
              printf '**%s**\n%s' 'Performance' "$PERF")${NL}"
            [ -n "$DOCS" ] && HIGHLIGHTS="${HIGHLIGHTS}$(printf '**%s**\n%s' 'Docs' "$DOCS")${NL}"
            [ -n "$TSTS" ] && HIGHLIGHTS="${HIGHLIGHTS}$(printf '**%s**\n%s' 'Tests' "$TSTS")${NL}"

            SCOPE_LINE=""
            if [ -n "$SCOPES" ]; then
              SCOPE_LINE="Areas: ${SCOPES} | "
            fi

            FOOTER="${SCOPE_LINE}*${TOTAL_COMMITS} total commits*"
            FOOTER="${FOOTER} | [npm](https://npm.pkg.github.com/package/@autumnsgrove/lattice)"
            FOOTER="${FOOTER} | [journey](https://grove.place/journey)"

            if [ -n "$HIGHLIGHTS" ]; then
              BODY=$(
                printf '%s\n\n### Highlights\n\n%s\n---\n%s' \
                  "$SUMMARY" "$HIGHLIGHTS" "$FOOTER"
              )
            else
              BODY=$(printf '%s\n\n---\n%s' "$SUMMARY" "$FOOTER")
            fi
          else
            BODY=$(
              printf '## @autumnsgrove/lattice v%s\n\n%s' \
                "$VERSION" \
                'See the [journey](https://grove.place/journey) for details.'
            )
          fi

          gh release create "$TAG" \
            --title "@autumnsgrove/lattice ${TAG}" \
            --notes "$BODY"

          echo "Created GitHub Release: $TAG"

      - name: Publish to GitHub Package Registry
        if: steps.version.outputs.changed == true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure npm for GitHub Package Registry
          echo "@autumnsgrove:registry=https://npm.pkg.github.com" \
            >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" \
            >> .npmrc

          cd libs/engine

          # Build the package (prepublishOnly runs svelte-package)
          pnpm run package

          # Publish
          pnpm publish --no-git-checks \
            || echo "Warning: Publish failed (may already exist)"

          echo "Published @autumnsgrove/lattice v${{ steps.version.outputs.current }}"

  # Separate job for backfilling historical summaries
  backfill:
    if: github.event.inputs.backfill_summaries == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Show versions to process
        run: |
          echo "📋 Versions in history.csv:"
          tail -n +2 snapshots/history.csv | cut -d',' -f2 | \
            grep '^v' | sort -V
          echo ""
          echo "📦 Existing summaries:"
          ls -1 snapshots/summaries/ 2>/dev/null \
            || echo "  (none)"

      - name: Run backfill script
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          chmod +x ./scripts/deploy/backfill-summaries.sh
          chmod +x ./scripts/generate/generate-release-summary.sh
          ./scripts/deploy/backfill-summaries.sh

      - name: Sync to landing page
        run: |
          mkdir -p apps/landing/static/data/summaries
          cp -r snapshots/summaries/* \
            apps/landing/static/data/summaries/
          echo "📦 Synced summaries to apps/landing/static/data/summaries/"
          ls -1 apps/landing/static/data/summaries/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "github-actions[bot]@users.noreply.github.com"
          git add snapshots/summaries/ \
            apps/landing/static/data/summaries/

          if git diff --staged --quiet; then
            echo "No new summaries generated"
            exit 0
          fi

          NEW_COUNT=$(
            git diff --staged --name-only | grep -c '\.json$' \
              || echo "0"
          )
          git commit -m \
            "docs: backfill $NEW_COUNT historical release summaries"
          git push origin main
          echo "Pushed $NEW_COUNT new summaries to main"
