# Grove Timeline Sync
# Automated nightly timeline summary generation for all enabled tenants
#
# Cron schedule: Daily at 1 AM UTC (after midnight activity settles)
# Each tenant generates their own summary using their own OpenRouter API key

name = "grove-timeline-sync"
main = "src/index.ts"
compatibility_date = "2025-12-01"

# =============================================================================
# Cron Triggers
# =============================================================================
[triggers]
crons = ["0 1 * * *"]  # Daily at 1 AM UTC

# =============================================================================
# D1 Database - Same database as engine
# =============================================================================
[[d1_databases]]
binding = "DB"
database_name = "grove-engine-db"
database_id = "a6394da2-b7a6-48ce-b7fe-b1eb3e730e68"

[[d1_databases]]
binding = "CURIO_DB"
database_name = "grove-curios-db"
database_id = "b03756ad-30d7-427a-9a1b-ec2f6478fcbd"

# =============================================================================
# Service Bindings — Lumen AI Gateway
# =============================================================================
# Routes AI calls through the full Lumen pipeline (PII scrub, quota, fallback)
# instead of raw OpenRouter API calls.
[[services]]
binding = "LUMEN"
service = "grove-lumen"

# =============================================================================
# Service Bindings — Pulse Observability
# =============================================================================
# Ships tenant-generation failures to pulse_events (grove-obs-db) so a bad
# cron night is visible in Arbor's /arbor/pulse/errors instead of only ever
# existing in ephemeral console.log output.
[[services]]
binding = "PULSE"
service = "grove-pulse-collector"

# =============================================================================
# Envelope Encryption - Key Encryption Key (KEK)
# =============================================================================
# The KEK decrypts per-tenant DEKs which decrypt the actual API tokens.
# Set via: gw secret apply GROVE_KEK --worker grove-timeline-sync
#
# IMPORTANT: Must be the EXACT same value as grove-lattice since they
# share the same D1 database. Use gw secret commands to ensure consistency.

# =============================================================================
# Secrets (configured via wrangler secret put)
# =============================================================================
# LUMEN_API_KEY        - API key for authenticating with the Lumen worker (REQUIRED)
#                        Set via: gw secret apply LUMEN_API_KEY --worker grove-timeline-sync
# OPENROUTER_API_KEY   - Optional fallback if tenant key fails
# TOKEN_ENCRYPTION_KEY - Optional. Decrypts the legacy per-column token fields on
#                        timeline_curio_config if a tenant's secret is missing from
#                        tenant_secrets (auto-migrates it back into tenant_secrets on
#                        read). Same value as used elsewhere for legacy token columns.
#                        Set via: gw secret apply TOKEN_ENCRYPTION_KEY --worker grove-timeline-sync
# TIMELINE_ADMIN_KEY   - REQUIRED to use the manual-trigger/debug HTTP routes
#                        (GET /, /tenants, /debug). Without it those routes are
#                        blocked entirely — this worker is cron-only otherwise.
#                        Set via: gw secret apply TIMELINE_ADMIN_KEY --worker grove-timeline-sync
