name = "grove-backups"
main = "src/index.ts"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]

# Cron triggers:
# - Daily at 3:00 AM UTC: Priority databases (groveauth, grove-engine-db)
# - Weekly on Sunday at 4:00 AM UTC: All databases
[triggers]
crons = ["0 3 * * *", "0 4 * * SUN"]

# ============================================
# Source D1 Databases (7 Grove databases)
# ============================================

[[d1_databases]]
binding = "GROVEAUTH_DB"
database_name = "groveauth"
database_id = "45eae4c7-8ae7-4078-9218-8e1677a4360f"

[[d1_databases]]
binding = "GROVE_ENGINE_DB"
database_name = "grove-engine-db"
database_id = "a6394da2-b7a6-48ce-b7fe-b1eb3e730e68"

[[d1_databases]]
binding = "GROVE_DOMAIN_JOBS_DB"
database_name = "grove-domain-jobs"
database_id = "cd493112-a901-4f6d-aadf-a5ca78929557"

[[d1_databases]]
binding = "AMBER_DB"
database_name = "amber"
database_id = "f688021b-a986-495a-94bb-352354768a22"

[[d1_databases]]
binding = "IVY_DB"
database_name = "ivy-db"
database_id = "57738720-bc43-4a7f-ad5b-ceb86b3c0542"

[[d1_databases]]
binding = "GROVE_CURIOS_DB"
database_name = "grove-curios-db"
database_id = "b03756ad-30d7-427a-9a1b-ec2f6478fcbd"

[[d1_databases]]
binding = "GROVE_OBSERVABILITY_DB"
database_name = "grove-observability-db"
database_id = "59e70f9e-8f9c-4021-96e5-1e130e753766"

# ============================================
# Metadata Database (for backup tracking)
# ============================================

[[d1_databases]]
binding = "METADATA_DB"
database_name = "grove-backups-db"
database_id = "4ad25abc-f972-4159-ac81-578806709275"

# ============================================
# R2 Backup Storage
# ============================================

[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "grove-backups"

# ============================================
# Environment Variables
# ============================================

[vars]
RETENTION_WEEKS = "12"
ALERT_ON_SUCCESS = "false"
ALERT_ON_FAILURE = "true"
ZEPHYR_URL = "https://grove-zephyr.m7jv4v7npb.workers.dev"
ALERT_EMAIL = "autumn@autumnsgrove.com"

# Set via: wrangler secret put ZEPHYR_API_KEY
# Set via: wrangler secret put API_KEY
