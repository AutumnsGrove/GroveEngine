# Grove Ivy — Zero-knowledge email client
# Deployed to: ivy.grove.place
#
# SvelteKit Worker with adapter-cloudflare output. Build command is
# handled by the CI workflow (_deploy-worker.yml with run-build: true),
# so there is no [build] section here.

name = "grove-ivy"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]

# Static assets served alongside the Worker
[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"

# Route — directs ivy.grove.place to this Worker
# More specific than grove-router's *.grove.place wildcard, so this
# takes precedence automatically.
[[routes]]
pattern = "ivy.grove.place/*"
zone_name = "grove.place"

# Local development — port assignment to avoid collisions with other apps
[dev]
port = 5178

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "ivy-db"
database_id = "57738720-bc43-4a7f-ad5b-ceb86b3c0542"
migrations_dir = "migrations"

# R2 Storage
[[r2_buckets]]
binding = "R2"
bucket_name = "ivy-storage"

# KV Namespace (for rate limiting, caching)
[[kv_namespaces]]
binding = "KV"
id = "a325ec2e391543f7b9b77e25aa3da977"

# Durable Object binding (TriageDO hosted in grove-durable-objects)
[[durable_objects.bindings]]
name = "TRIAGE"
class_name = "TriageDO"
script_name = "grove-durable-objects"

# Heartwood auth service binding (Worker-to-Worker)
[[services]]
binding = "AUTH"
service = "groveauth"

# Zephyr service binding (email delivery)
[[services]]
binding = "ZEPHYR"
service = "grove-zephyr"

# Workers AI binding (for Lumen classification)
[ai]
binding = "AI"

# Observability — structured logs in Cloudflare dashboard
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

# Environment variables (use secrets for sensitive values)
[vars]
ENVIRONMENT = "development"

# Secrets (set via wrangler secret put)
# FORWARD_EMAIL_API_KEY
# WEBHOOK_SECRET
# OPENROUTER_API_KEY
# ZEPHYR_API_KEY
# OWNER_EMAIL

# Production environment
[env.production]
vars = { ENVIRONMENT = "production" }

# Scheduled triggers (for queue processing)
[triggers]
crons = ["* * * * *"]  # Every minute - process send queue
